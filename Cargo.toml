[package]
name = "rust-dleq"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"
authors = ["macgyver13 <macgyver.dev@proton.me>"]
license = "CC0-1.0"
description = "BIP-374 DLEQ (Discrete Log Equality) proof generation and verification"
repository = "https://github.com/macgyver13/rust-dleq"
keywords = ["dleq", "bip-374", "libsecp256k1"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
secp256k1 = { version = "0.33", default-features = false, optional = true }
bitcoin_hashes = { version = "1.0", default-features = false, features = ["hex"] }
serde = { version = "1.0", optional = true }

[build-dependencies]
cc = { version = "1.0", optional = true }

[dev-dependencies]
secp256k1 = { version = "0.33", features = ["std", "rand"] }

[features]
default = ["std", "standalone"]

# Standard library support
std = ["bitcoin_hashes/std"]

# Standalone implementation (pure Rust + rust-secp256k1 EC ops)
standalone = ["secp256k1", "std"]

# Native implementation (direct FFI to libsecp256k1 from PR #1802)
# Note: This feature requires the secp256k1 git submodule
native = ["cc", "secp256k1", "std"]

# Serde support
serde = ["dep:serde"]