[package]
name = "rust-dleq"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"
authors = ["macgyver13 <macgyver.dev@proton.me>"]
license = "CC0-1.0"
description = "BIP-374 DLEQ (Discrete Log Equality) proof generation and verification"
repository = "https://github.com/macgyver13/rust-dleq"
keywords = ["dleq", "bip-374", "libsecp256k1"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
secp256k1 = { version = "0.29", default-features = false }
bitcoin_hashes = { version = "0.14", default-features = false }
serde = { version = "1.0", optional = true }

[dev-dependencies]
secp256k1 = { version = "0.29", features = ["std", "rand-std"] }
hex = "0.4"

[features]
default = ["std"]
serde = ["dep:serde"]
std = ["secp256k1/std", "bitcoin_hashes/std"]